<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;
                 script-src 'self'; base-uri 'none'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Ticketing • Buy Tickets</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="attendee.js" defer></script>
  </head>
  <body>
    <div class="shell" style="grid-template-columns: 1fr">
      <!-- no sidebar -->
      <main class="container">
        <section class="tab active" id="shop">
          <div class="card">
            <div class="row space">
              <h3 style="margin: 0">Browse events</h3>
              <input
                id="q"
                class="input"
                placeholder="Search title / city / venue"
                style="max-width: 280px"
              />
            </div>
            <div id="events" class="grid cards-3" style="margin-top: 8px"></div>
            <p id="noEvents" class="small" style="display: none">
              No events found.
            </p>
          </div>

          <!-- Checkout -->
          <div class="card" id="checkout" style="display: none">
            <div class="row space">
              <h3 style="margin: 0">Checkout</h3>
              <button id="cancel" class="pill">Cancel</button>
            </div>
            <div id="evSummary" class="small"></div>

            <div
              class="row"
              style="gap: 14px; flex-wrap: wrap; margin-top: 12px"
            >
              <div>
                <div class="label">Tier</div>
                <select id="tier" class="input" style="width: 160px">
                  <option value="GA">General Admission</option>
                  <option value="VIP">VIP</option>
                </select>
              </div>
              <div>
                <div class="label">Quantity</div>
                <input
                  id="qty"
                  class="input"
                  type="number"
                  min="1"
                  step="1"
                  value="2"
                  style="width: 120px"
                />
              </div>
              <div style="flex: 1; min-width: 220px">
                <div class="label">Buyer name</div>
                <input
                  id="buyer"
                  class="input"
                  type="text"
                  placeholder="A. Example"
                />
              </div>
            </div>

            <div class="label" style="margin-top: 10px">Payment method</div>
            <div class="pay-grid" id="payGrid">
              <button type="button" class="pay-method" data-method="apple">
                <span> Apple&nbsp;Pay</span>
              </button>
              <button type="button" class="pay-method" data-method="visa">
                <span>Visa</span>
              </button>
              <button type="button" class="pay-method" data-method="mc">
                <span>Mastercard</span>
              </button>
              <button type="button" class="pay-method" data-method="paypal">
                <span>PayPal</span>
              </button>
              <button type="button" class="pay-method" data-method="mtn">
                <span>MTN MoMo</span>
              </button>
              <button type="button" class="pay-method" data-method="airtel">
                <span>Airtel Money</span>
              </button>
            </div>

            <div class="row" style="gap: 10px; margin-top: 14px">
              <div class="kpi" id="totalKPI">UGX 0</div>
              <button id="pay" class="btn">Pay now</button>
            </div>
            <p class="small" id="payNote" style="margin-top: 8px"></p>
          </div>

          <!-- Orders on this device -->
          <div class="card">
            <div class="row space">
              <h3 style="margin: 0">My orders (this device)</h3>
              <span id="orderCount" class="badge">0</span>
            </div>
            <div id="ordersEmpty" class="small">You have no orders yet.</div>
            <div id="ordersWrap" style="display: none">
              <table class="table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Event</th>
                    <th>Tier</th>
                    <th>Qty</th>
                    <th style="text-align: right">Total</th>
                    <th style="text-align: right">Receipt</th>
                  </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
<script src="attendee.js" defer></script>
